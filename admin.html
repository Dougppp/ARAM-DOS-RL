<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ARAM DOS RL</title>
    <style>
        :root {
            --bg-body: #0d1117;
            --bg-container: #161b22;
            --blue: #58a6ff;
            --orange: #f08d49;
            --green: #3fb950;
            --border: #30363d;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: var(--bg-container); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        
        /* Menu de Navegação */
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .nav-link { padding: 10px 20px; background: #21262d; border: 1px solid var(--border); color: var(--blue); text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: var(--blue); color: white; border-color: var(--blue); }

        .pix-box { background: #1c2128; border: 2px dashed var(--green); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 30px; }
        .pix-key { font-size: 22px; font-weight: bold; color: #fff; display: block; margin: 10px 0; }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-body); margin-bottom: 40px; }
        th { background: #1f2937; color: var(--blue); padding: 12px; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); }
        .status-pago { color: var(--green); font-weight: bold; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .print-card { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
        .print-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <nav class="nav-menu">
        <a href="index.html" class="nav-link">🏆 Classificação</a>
        <a href="admin.html" class="nav-link active">💰 Pagamentos & Provas</a>
    </nav>

    <div class="pix-box">
        <span style="color: var(--green)">🏆 CHAVE PIX PARA INSCRIÇÃO</span>
        <span class="pix-key">117.440.914-20</span>
        <div style="font-size: 14px; color: #8b949e;">Douglas - Itaú | <b>Valor: R$ 10,00 por jogador</b></div>
    </div>

    <h2 style="color: var(--blue)">✅ Status de Pagamento</h2>
    <table>
        <thead><tr><th>Equipe</th><th>Jogador</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody id="corpo-pagamentos"></tbody>
    </table>

    <h2 style="color: var(--blue)">🖼️ Provas das Partidas</h2>
    <div class="gallery-grid" id="galeria-prints"></div>
</div>

<script>
    const ADMIN_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUeUJJ1AvSWlmC4vExOxHrcbJD2AVgDKcUxH1rE1EoKMSAatwyFA9gd8taGC2yBwGYNJDcMFjSdvLr/pub?gid=1281303703&single=true&output=csv';
    async function carregarDados() {
        try {
            const r = await fetch(ADMIN_CSV);
            const t = await r.text();
            const lines = t.split(/\r?\n/).filter(l => l.trim() !== "").slice(1);
            const corpo = document.getElementById('corpo-pagamentos');
            const galeria = document.getElementById('galeria-prints');
            corpo.innerHTML = ''; galeria.innerHTML = '';

            lines.forEach(line => {
                const cols = line.split(',').map(c => c.replace(/"/g, '').trim());
                if (cols.length >= 4) {
                    const tr = document.createElement('tr');
                    const pago = cols[3]?.toLowerCase() === 'pago';
                    tr.innerHTML = `<td>${cols[0]}</td><td>${cols[1]}</td><td>${cols[2]}</td><td class="${pago?'status-pago':''}">${cols[3]}</td>`;
                    corpo.appendChild(tr);

                    if (cols[5] && cols[5].startsWith('http')) {
                        const div = document.createElement('div');
                        div.className = 'print-card';
                        div.innerHTML = `<img src="${cols[5]}"><div style="font-size:12px; margin-top:5px; color:var(--orange)">${cols[0]}</div>`;
                        galeria.appendChild(div);
                    }
                }
            });
        } catch (e) { console.error(e); }
    }
    carregarDados();
    setInterval(carregarDados, 60000);
</script>
</body>
</html>
